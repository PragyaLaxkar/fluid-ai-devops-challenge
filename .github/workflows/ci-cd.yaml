name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'              # don't loop: bot commits to k8s/ shouldn't trigger CI
      - 'README.md'
      - '.github/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the manifest update
      packages: write        # needed to push to GHCR
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tag
        id: tag
        run: |
          # Lowercase the repo name (GHCR requires lowercase)
          IMAGE_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=$IMAGE_LOWER" >> $GITHUB_OUTPUT
          echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.sha }}
            ${{ steps.tag.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update manifest with new image tag
        run: |
          NEW_IMAGE="${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.sha }}"
          echo "Updating deployment to use: $NEW_IMAGE"
          # Replace whatever image line is there with the new one
          sed -i "s|image: ghcr.io/.*devops-challenge-app:.*|image: $NEW_IMAGE|" k8s/app-deployment.yaml
          cat k8s/app-deployment.yaml | grep "image:"

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app-deployment.yaml
          # Only commit if something changed
          git diff --staged --quiet || git commit -m "ci: bump image to ${{ steps.tag.outputs.sha }} [skip ci]"
          git push
