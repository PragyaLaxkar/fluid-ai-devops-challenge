apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: devops-challenge
  labels:
    app: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # zero-downtime: always keep desired count serving
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/pragyalaxkar/fluid-ai-devops-challenge-app:2291a0d
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_DB }
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: db-credentials, key: POSTGRES_PASSWORD }

          # --- THE RELIABILITY STORY ---
          # Liveness: is the process alive? If not, restart the container.
          # We hit /health which does NOT touch the DB. If we used /ready here,
          # a transient DB outage would cause cascading container restarts
          # across every pod — a classic anti-pattern.
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # Readiness: should this pod receive traffic right now?
          # /ready checks the DB. If DB is briefly unreachable, the pod is
          # pulled from the Service endpoints but NOT restarted. When the DB
          # comes back, the pod re-joins automatically.
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
